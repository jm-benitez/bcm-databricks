name: Secret Scan

# Same scanner as .claude/hooks/stop-secret-scan.sh (gitleaks) and
# .pre-commit-config.yaml, so a secret the local hook missed is still caught
# before merge. Unlike claude-review.yml this job is deterministic, does not
# call Claude, and fails the check on a finding.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2" # keep in step with .pre-commit-config.yaml

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history and working tree
        run: gitleaks detect --source . --redact --verbose
