# Install once:  pre-commit install
# Secret scan mirrors .claude/hooks/stop-secret-scan.sh and
# .github/workflows/secret-scan.yml; keep the gitleaks version the same in all three.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
